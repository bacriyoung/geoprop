model:
  NAME: GeoPointNeXt
  num_classes: 13
  
  encoder_args:
    NAME: PointNextEncoder
    blocks: [1, 3, 5, 3, 3]
    strides: [1, 4, 4, 4, 4]
    sa_layers: 1 
    sa_use_res: False 
    width: 32
    in_channels: 4
    expansion: 4
    radius: 0.1
    nsample: 32
    aggr_args:
      feature_type: 'dp_fj'
      reduction: 'max'
    group_args:
      NAME: 'ballquery'
      normalize_dp: True
    conv_args:
      order: conv-norm-act
    act_args:
      act: 'relu'
    norm_args:
      norm: 'bn'

  decoder_args:
    NAME: PointNextDecoder
    width: 32 

  geo_args:
    qk_dim: 64
    k: 16
    geo_scale: 0.04

# -----------------------------------------------------------------
# 明确指定使用 GeoCoTrainLoss
# -----------------------------------------------------------------
criterion:
  NAME: GeoCoTrainLoss
  lambda_main: 1.0
  lambda_aux: 1.0
  lambda_aff: 0.5
  lambda_rec: 0.5
  ignore_index: 255

batch_size: 4